services:
  app:
    build: .
    container_name: worknest-api

    ports:
      - "3000:3000"

    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      - db

    volumes:
      - .:/app
      - /app/node_modules

  db:
    image: mysql:8.4

    container_name: worknest-db

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
    - mysql_data:/var/lib/mysql
    - ./src/config/worknest.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_data: